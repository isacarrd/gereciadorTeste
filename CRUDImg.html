<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD + Imagem</title>
  <style>
    form {
      display: flex;
      flex-direction: column;
      width: 500px;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px;
      gap: 24px;
    }

    #produtos {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .produtoCard {
      width: 200px !important;
      background-color: #E5E4DF;
      width: fit-content;
      padding: 15px;
      border-radius: 20px;
      /* cursor: pointer; */
    }

    .quantidadeZero {
      color: #828282;
      cursor: not-allowed;
    }

    #createProduct {
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 26px;
      background-color: #913F1D;
      border: none;
      color: #E5E4DF;
      font-size: 48px;
      border-radius: 100%;
      cursor: pointer;
    }

    #createProduct:hover {
      border: 5px solid black;
    }

    .texto {
      font-family: Arial, Helvetica, sans-serif;
    }

    .botao {
      border: 1px solid #913F1D;
      padding: 8px;
      border-radius: 10px;
      background-color: #E5E4DF;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
    }

    .botao:hover {
      background-color: #913F1D;
    }

    :disabled {
      cursor: not-allowed;
      color: #828282;
    }

    .botao:disabled:hover {
      background-color: initial;
    }

    .imagemDoProduto {
      max-width: 100%;
    }
  </style>
</head>

<body>

  <label for="search"></label>
  <input type="search" placeholder="Pesquisa" id="pesquisa">
  <button type="submit" id="pesquisar">Pesquisar</button>

  <div id="card">
    <form action="">
      <div class="campo">
        <label for="nomeProduto">Nome do produto: </label>
        <input type="text" placeholder="Nome do Produto" id="nomeProduto">
      </div>
      <div class="campo">
        <label for="descProduto">Descrição do produto: </label>
        <input type="text" placeholder="Descrição do Produto" id="descProduto">
      </div>
      <div class="campo">
        <label for="categProduto">Categoria do produto <strong>(separado por vírgulas)</strong>: </label>
        <input type="text" placeholder="Categoria do Produto" id="categProduto">
      </div>
      <div class="campo">
        <label for="quantProduto">Quantidade do produto: </label>
        <input type="text" placeholder="Quantidade do Produto" id="quantProduto">
      </div>
      <div class="campo">
        <input type="file" name="imgProduto" id="imgProduto">
      </div>
      <button id="createProduct" onclick="produto.createProduct()" type="button">+</button>
    </form>
    <div id="produtos">
      <script src="/imgCRUD.js"></script>
    </div>
  </div>
</body>

</html>
