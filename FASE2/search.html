<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste Search</title>
  <style>
    * {
      font-family: Arial, Helvetica, sans-serif;
    }

    .produtos-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
    }

    .produto-card {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .produto-card img {
      max-width: 100%;
      height: 150px;
      object-fit: contain;
    }

    .pd {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
  </style>
</head>

<body>
  <h1>Testando Pesquisa em Extenso</h1>
  <p>(com ID + string)</p>
  <input type="text" placeholder="Insira um nome" id="inputTeste">

  <div id="produtos" class="produtos-container">
    Nenhum produto aqui...
  </div>

  <script>

    let setCampo
    const inputTeste = document.getElementById('inputTeste');
    const divProdutos = document.getElementById('produtos');

    const renderProd = (product) => {
      const card = document.createElement('div')
      card.className = 'produto-card'

      card.innerHTML = `
          <span>ID: ${product.id}</span>
          <img src="${product.thumbnail}" alt="${product.title}">
            <h3>${product.title}</h3>
            <p>${product.description}</p>
          <div class="pd">
            <span>${product.category}</span>
            <strong>${product.price}</strong>
            <span>Estoque: ${product.stock}</span>
          </div>
        `

      divProdutos.appendChild(card)
    }

    const buscandoDados = async (campo = "", id = undefined) => {
      divProdutos.innerHTML = "Carregando..."

      let url;

      if (campo.trim() === "" && id === undefined) {
        url = "https://dummyjson.com/products?limit=0";
      } else if (id !== undefined) {
        url = `https://dummyjson.com/products/${id}`;
      } else {
        url = `https://dummyjson.com/products/search?q=${encodeURIComponent(campo)}`; 
      }

      try {

        const res = await fetch(url)
        if (!res.ok) { throw new Error('Dados Vazios') }

        const dados = await res.json()
        divProdutos.innerHTML = ""

        if (dados.products) {
          if (dados.products.length === 0) {
            divProdutos.innerHTML = "Produto não encontrado."
            return
          }
          dados.products.forEach(prod => {
            renderProd(prod)
          });
        } else {
          renderProd(dados)
        }

      } catch (error) {
        console.error('Erro encontrado: ' + error)
        divProdutos.innerHTML = "Produto não encontrado."
        return
      }
    }

    inputTeste.addEventListener('input', (evt) => {
      // console.log(evt.target.value)
      const campo = evt.target.value.replace(/\s/g, '')
      let numAchados = []
      // console.log(campo)

      for (const camp of campo) {
        if (/\d/.test(camp)) {
          numAchados.push(camp)
        }
      }
      // console.log(numAchados)
      const numerosId = numAchados.join('')
      console.log(numerosId)

      clearTimeout(setCampo)

      // /^\d+$/ -> serve para validar se uma string inteira contém apenas números (um ou mais dígitos), do início ao fim
      setCampo = setTimeout(() => {
        if (/^\d+$/.test(campo)) {
          buscandoDados("", numerosId);
        } else {
          buscandoDados(campo);
        }
      }, 500);
    })

    buscandoDados()
  </script>
</body>

</html>
