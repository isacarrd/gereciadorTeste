<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search + Update</title>
  <style>
    * {
      font-family: Arial, Helvetica, sans-serif;
    }

    .produtos-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
    }

    .produto-card {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .produto-card img {
      max-width: 100%;
      height: 150px;
      object-fit: contain;
    }

    .pd {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .boxes {
      padding: 24px;
      display: flex;
      gap: 12px;
    }

    form {
      flex-direction: column;
      padding: 24px;
      display: flex;
      gap: 12px;
    }

    button {
      width: fit-content;
    }

    .categ {
      padding: 8px;
      background-color: #ccc;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <h1>Pesquisando e Atualizando produtos</h1>
  <p>(e renderizando)</p>

  <label for="selectMethod">Select the method: </label>
  <select name="selectMethod" id="selectMethod">
    <option value="">Action</option>
    <option value="POST">POST [Adicionar]</option>
    <option value="PUT">PUT [Atualizar]</option>
    <option value="DELETE">DELETE [Deletar]</option>
  </select>


  <div class="boxes">
    <label for="searchInput"><strong>Search product [id, category or name]:</strong></label>
    <input type="text" placeholder="Insira um nome" id="searchInput">
  </div>

  <div id="formArea">
  </div>

  <div id="produtos" class="produtos-container">
    Nenhum produto aqui...
  </div>

  <script>

    const createdProducts = []
    const selectMethod = document.getElementById('selectMethod')
    // const formConfirm = document.querySelector('form')

    let setCampo
    const searchInput = document.getElementById('searchInput');
    const divProdutos = document.getElementById('produtos');
    const formArea = document.getElementById('formArea')

    const renderProd = (product) => {
      const card = document.createElement('div')
      card.className = 'produto-card'

      card.innerHTML = `
            <span>ID: ${product.id}</span>
              <h3>${product.title}</h3>
              <p>${product.description}</p>
            <div class="pd">
              <span>${product.category}</span>
              <span><strong>Estoque: ${product.stock}</strong></span>
            </div>
          `

      divProdutos.appendChild(card)
    }

    selectMethod.addEventListener('change', (evt) => {
      const selectedValue = evt.target.value
      // console.log("Valor escolhido: ", selectedValue)
      renderForm(selectedValue)
    })

    function renderForm(method) {
      let message

      switch (method) {
        case "POST":
          console.log("método selecionado: ", method)
          formArea.innerHTML = `
            <form data-method="${method}" id="formConfirm">
              <div class="labelProd">
                <label for="nameProd"><strong>Product Name:</strong></label>
                <input type="text" name="nameProd" id="nameProd" placeholder="Product Name" required>
              </div>
              <div class="labelProd">
                <label for="descProd"><strong>Product Description:</strong></label>
                <input type="text" name="descProd" id="descProd" placeholder="Product Description" required>
              </div>
              <div class="labelProd">
                <label for="categProd"><strong>Product Category:</strong></label>
                <input type="text" name="categProd" id="categProd" placeholder="Product Category" required>
              </div>
              <div class="labelProd">
                <label for="stockProd"><strong>Product Stock:</strong></label>
                <input type="number" name="stockProd" id="stockProd" placeholder="Product Stock" required>
              </div>
              <button type="submit">Confirm</button>
            </form>
          `
          break;
        case "PUT":
          console.log("método selecionado: ", method)
          formArea.innerHTML = `
            <form data-method="${method}" id="formConfirm">
              <div class="labelProd">
                <label for="idProd"><strong>Product ID:</strong></label>
                <input  type="number" name="idProd" id="idProd" placeholder="Product ID">
              </div>
              <div class="labelProd">
                <label for="nameProd"><strong>Product Name:</strong></label>
                <input type="text" name="nameProd" id="nameProd" placeholder="Product Name">
              </div>
              <div class="labelProd">
                <label for="descProd"><strong>Product Description:</strong></label>
                <input type="text" name="descProd" id="descProd" placeholder="Product Description">
              </div>
              <div class="labelProd">
                <label for="categProd"><strong>Product Category:</strong></label>
                <input type="text" name="categProd" id="categProd" placeholder="Product Category">
              </div>
              <div class="labelProd">
                <label for="stockProd"><strong>Product Stock:</strong></label>
                <input type="number" name="stockProd" id="stockProd" placeholder="Product Stock">
              </div>
              <button type="submit">Confirm</button>
            </form>
          `
          break;
        case "DELETE":
          console.log("método selecionado: ", method)
          formArea.innerHTML = `
            <form data-method="${method}" id="formConfirm">
              <div class="labelProd">
                <label for="idProd"><strong>Product ID:</strong></label>
                <input  type="number" name="idProd" id="idProd" placeholder="Product ID" required>
              </div>
              <button type="submit">Confirm</button>
            </form>
          `
          break;
        default:
          message = "Valor inválido."
          console.log(message)
          // formArea.innerHTML = `<span>${message}</span>`
          formArea.innerHTML = ""
          break;
      }
    }

    const API = 'https://dummyjson.com/products' // url base
    const requests = {
      /* cada chave aponta para um objeto com duas propriedades: 
        1. httMethod -> verbo HTTP que o fetch vai usar
        2. url -> uma função, não uma string, necessária porque a URL depende dos dados 
      */
      POST: { url: () => `${API}/add`, httpMethod: 'POST' },
      PUT: { url: ({ id }) => `${API}/${id}`, httpMethod: 'PUT' }, // parâmetro desestruturizado (destructuring), já extraindo a propriedade ID
      DELETE: { url: ({ id }) => `${API}/${id}`, httpMethod: 'DELETE' },
    }

    /* 
      method (ação) -> POST | PUT | DELETE; 
      dados -> objeto com os dados do formulário 
    */

    const sendRequest = async (method, dados) => {
      const { url, httpMethod } = requests[method] // acessa o objeto pela chave dinâmica, ex: method = PUT? logo requests.PUT
      const options = { method: httpMethod } // verbo + segundo argumento do fetch (o objeto de opções)

      /* o DELETE precisa apenas do ID, e não dos dados */
      if (httpMethod !== 'DELETE') {
        options.headers = { 'Content-Type': 'application/json' } // corpo da requisição é em JSON (básico)
        options.body = JSON.stringify(dados)  // converte o objeto JS em uma string JSON para o fetch
      }

      /* onde a requisição em si é feita, chamando a URL da tabela, passando:
        1. dados -> conteúdo a ser enviado
        2. options -> define como a requisição é feita
      */
      const res = await fetch(url(dados), options)
      if (!res.ok) throw new Error(`Erro na requisição: ${res.status}`)
      return res.json()
    }

    // substitui o formConfirm.onsubmit
    formArea.addEventListener('submit', async (evt) => {
      evt.preventDefault()
      let message

      const form = evt.target                       // o form que disparou o evento
      const method = form.dataset.method            // "POST" | "PUT" | "DELETE"
      const data = Object.fromEntries(new FormData(form))

      const dados = {
        id: data.idProd,
        title: data.nameProd,
        description: data.descProd,
        category: data.categProd,
        stock: Number(data.stockProd),
      }

      try {
        const result = await sendRequest(method, dados)

        if (method === 'POST') {
          createdProducts.push(result)
          renderProd(result)
          message = "Produto criado com sucesso!"
        } else if (method === 'PUT') {
          console.log('Atualizado:', result)
          // aqui você troca o card antigo pelo novo
          message = `Produto de id ${dados.id} atualizado com sucesso!`
        } else if (method === 'DELETE') {
          console.log('Deletado:', result) 
          // vem com isDeleted: true
          // aqui você remove o card da tela
          message = `Produto de id ${dados.id} deletado com sucesso!`
        }
        console.log(message)


        form.reset()
      } catch (error) {
        console.error('Erro: ', error)
      }
    })

    const buscandoDados = async (campo = "", id = undefined, categorie = []) => {
      divProdutos.innerHTML = "Carregando..."

      let url;

      if (id !== undefined) {
        url = `https://dummyjson.com/products/${id}`;
      } else if (categorie.length > 0) {
        url = `https://dummyjson.com/products/category/${categorie[0]}`;
      } else if (campo.trim() !== "") {
        url = `https://dummyjson.com/products/search?q=${encodeURIComponent(campo)}`;
      } else {
        url = "https://dummyjson.com/products?limit=15";
      }

      try {
        const res = await fetch(url)
        if (!res.ok) { throw new Error('Dados Vazios') }

        const dados = await res.json()
        divProdutos.innerHTML = ""

        if (dados.products) {
          const allProducts = [...dados.products, ...createdProducts]
          if (allProducts.length === 0) {
            divProdutos.innerHTML = "Produto não encontrado."
            return
          }
          allProducts.forEach(prod => {
            renderProd(prod)
          });
        } else {
          renderProd(dados)
        }

      } catch (error) {
        console.error('Erro encontrado: ' + error)
        divProdutos.innerHTML = "Produto não encontrado."
        return
      }
    }

    let categFind = []

    const buscandoCateg = async () => {
      try {
        const res = await fetch('https://dummyjson.com/products/category-list')
        categFind = await res.json()
      } catch (error) {
        console.error('Erro ao buscar categoria: ', error)
      }
    }

    buscandoCateg()

    searchInput.addEventListener('input', async (evt) => {
      const campo = evt.target.value.replace(/\s/g, '')
      let numAchados = []

      const categAchada = campo ? categFind.filter(categ => categ.toLowerCase().includes(campo)) : [];

      for (const camp of campo) {
        if (/\d/.test(camp)) {
          numAchados.push(camp)
        }
      }

      const numerosId = numAchados.join('')
      console.log(numerosId)

      clearTimeout(setCampo)

      setCampo = setTimeout(() => {
        if (/^\d+$/.test(campo)) {
          buscandoDados("", numerosId);
        } else {
          buscandoDados(campo, undefined, categAchada);
        }
      }, 500);
    })

    buscandoDados()
  </script>
</body>

</html>
