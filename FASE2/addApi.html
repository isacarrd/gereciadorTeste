<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add API</title>
  <style>
    * {
      font-family: Arial, Helvetica, sans-serif;
    }

    .produtos-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
    }

    .produto-card {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .produto-card img {
      max-width: 100%;
      height: 150px;
      object-fit: contain;
    }

    .pd {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    form {
      flex-direction: column;
      padding: 24px;
      display: flex;
      gap: 12px;
    }
    button{
      width: fit-content;
    }
  </style>
</head>

<body>
  <h1>Teste de adição de produto</h1>
  <div>
    <!-- Vai ser utilizado apartir do teste de método UPDATE -->
    <label for="selectMethod">Select the method: </label>
    <select name="selectMethod" id="selectMethod">
      <option value="">Ação</option>
      <option value="POST">POST [Adicionar]</option>
      <option value="UPDATE">UPDATE [Atualizar]</option>
      <option value="DELETE">DELETE [Deletar]</option>
    </select>
  </div>

  <form action="" id="formProd">
    <div class="labelProd">
      <label for="nameProd"><strong>Product Name:</strong></label>
      <input type="text" name="nameProd" id="nameProd" placeholder="Product Name">
    </div>
    <div class="labelProd">
      <label for="descProd"><strong>Product Description:</strong></label>
      <input type="text" name="descProd" id="descProd" placeholder="Product Description">
    </div>
    <div class="labelProd">
      <label for="categProd"><strong>Product Category:</strong></label>
      <input type="text" name="categProd" id="categProd" placeholder="Product Category">
    </div>
    <div class="labelProd">
      <label for="stockProd"><strong>Product Stock:</strong></label>
      <input type="number" name="stockProd" id="stockProd" placeholder="Product Stock">
    </div>
    <button type="submit">Confirm</button>
  </form>

  <script>

    /* 
      O que deve ser feito:
      1. Pegar os valores dos campos/inputs e ler seus valores;
      2. Ao dar submit (button), os dados dos inputs são passados para o body da requisição;
      3. Ao dar submit (button), os campos devem esvaziar; 
      4. Os produtos criados devem aparecer no console.
    */

    fetch('https://dummyjson.com/products/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title: 'BMW Pencil',
        description: 'idk',
        category: 'cars?',
        stock: 1
      })
    })
      .then(res => res.json())
      .then(console.log);
  </script>
</body>

</html>
