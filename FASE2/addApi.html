<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add API</title>
  <style>
    * {
      font-family: Arial, Helvetica, sans-serif;
    }

    .produtos-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
    }

    .produto-card {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .produto-card img {
      max-width: 100%;
      height: 150px;
      object-fit: contain;
    }

    .pd {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    form {
      flex-direction: column;
      padding: 24px;
      display: flex;
      gap: 12px;
    }

    button {
      width: fit-content;
    }
  </style>
</head>

<body>
  <h1>Teste de adição de produto</h1>
  <div>
    <!-- Vai ser utilizado apartir do teste de método UPDATE -->
    <label for="selectMethod">Select the method: </label>
    <select name="selectMethod" id="selectMethod">
      <option value="">Action</option>
      <option value="POST">POST [Adicionar]</option>
      <option value="UPDATE">UPDATE [Atualizar]</option>
      <option value="DELETE">DELETE [Deletar]</option>
    </select>
  </div>

  <form action="" id="formConfirm">
    <div class="labelProd">
      <label for="nameProd"><strong>Product Name:</strong></label>
      <input type="text" name="nameProd" id="nameProd" placeholder="Product Name" required>
    </div>
    <div class="labelProd">
      <label for="descProd"><strong>Product Description:</strong></label>
      <input type="text" name="descProd" id="descProd" placeholder="Product Description" required>
    </div>
    <div class="labelProd">
      <label for="categProd"><strong>Product Category:</strong></label>
      <input type="text" name="categProd" id="categProd" placeholder="Product Category" required>
    </div>
    <div class="labelProd">
      <label for="stockProd"><strong>Product Stock:</strong></label>
      <input type="number" name="stockProd" id="stockProd" placeholder="Product Stock" required>
    </div>
    <button type="submit">Confirm</button>
  </form>

  <div id="teste"></div>
  <script>

    /* 
      O que deve ser feito:
      1. Pegar os valores dos campos/inputs e ler seus valores;
      2. Ao dar submit (button), os dados dos inputs são passados para o body da requisição;
      3. Ao dar submit (button), os campos devem esvaziar; 
      4. Os produtos criados devem aparecer no console.
    */

    //let proximoIdLocal = 1
    const createdProducts = []
    const formConfirm = document.querySelector('form')
    const divTeste = document.getElementById('teste')

    formConfirm.onsubmit = (evt) => {
      evt.preventDefault()
      const nameProd = document.getElementById('nameProd').value
      const descProd = document.getElementById('descProd').value
      const categProd = document.getElementById('categProd').value
      const stockProd = Number(document.getElementById('stockProd').value)

      passandoDados(nameProd, descProd, categProd, stockProd)
      formConfirm.reset()
    }

    function passandoDados(name, desc, categ, stock) {
      const dados = {
        title: name,
        description: desc,
        category: categ,
        stock: stock
      }
      buscaDados(dados)
    }

    function renderDados(data) {
      const divProd = document.createElement('div')
      divProd.innerHTML = `
        <h3>ID: ${data.id}</h3>
        <p>Name: ${data.title}</p>
        <p>Description: ${data.description}</p>
        <p>Category: ${data.category}</p>
        <p>Stock: ${data.stock}</p>
      `
      divTeste.appendChild(divProd)
    }

    const buscaDados = async (dados) => {
      let url = 'https://dummyjson.com/products/add'
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      })
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Erro na requisição: ${response.status}`);
          }// Converte a resposta do servidor para JSON
          return response.json();
        })
        .then((data) => {
          createdProducts.push(data)
          renderDados(data)
          console.log('Sucesso:', data);
          console.log('Produtos:', createdProducts)

/*           const product = {
            ...data,
            idLocal: proximoIdLocal++
          }
          createdProducts.push(data)
          renderDados({ ...product, id: product.idLocal })
          console.log('Sucesso:', data);
          console.log('Produtos:', createdProducts) */
        })
        .catch((error) => {
          console.error('Erro:', error);
        });
    }

  </script>
</body>

</html>
