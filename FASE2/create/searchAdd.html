<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search + Add</title>
  <style>
    * {
      font-family: Arial, Helvetica, sans-serif;
    }

    .produtos-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
    }

    .produto-card {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .produto-card img {
      max-width: 100%;
      height: 150px;
      object-fit: contain;
    }

    .pd {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .boxes {
      padding: 24px;
      display: flex;
      gap: 12px;
    }

    form {
      flex-direction: column;
      padding: 24px;
      display: flex;
      gap: 12px;
    }

    button {
      width: fit-content;
    }

    .categ {
      padding: 8px;
      background-color: #ccc;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <h1>Pesquisando e Criando produtos</h1>
  <p>(e renderizando)</p>

  <div class="boxes">
    <label for="inputTeste"><strong>Search product [id, category or name]:</strong></label>
    <input type="text" placeholder="Insira um nome" id="inputTeste">
  </div>

  <div>
    <form action="" id="formConfirm">
      <div class="labelProd">
        <label for="nameProd"><strong>Product Name:</strong></label>
        <input type="text" name="nameProd" id="nameProd" placeholder="Product Name" required>
      </div>
      <div class="labelProd">
        <label for="descProd"><strong>Product Description:</strong></label>
        <input type="text" name="descProd" id="descProd" placeholder="Product Description" required>
      </div>
      <div class="labelProd">
        <label for="categProd"><strong>Product Category:</strong></label>
        <input type="text" name="categProd" id="categProd" placeholder="Product Category" required>
      </div>
<!--       <div class="labelProd">
        <label for="priceProd"><strong>Product Price: </strong></label>
        <input type="number" name="priceProd" id="priceProd" placeholder="Product Price" step="0.01" min="0">
      </div> -->
      <div class="labelProd">
        <label for="stockProd"><strong>Product Stock:</strong></label>
        <input type="number" name="stockProd" id="stockProd" placeholder="Product Stock" required>
      </div>
      <button type="submit">Confirm</button>
    </form>
  </div>

  <div id="produtos" class="produtos-container">
    Nenhum produto aqui...
  </div>

  <script>

    const createdProducts = []
    const formConfirm = document.querySelector('form')

    let setCampo
    const inputTeste = document.getElementById('inputTeste');
    const divProdutos = document.getElementById('produtos');

    const renderProd = (product) => {
      const card = document.createElement('div')
      card.className = 'produto-card'

      card.innerHTML = `
            <span>ID: ${product.id}</span>
              <h3>${product.title}</h3>
              <p>${product.description}</p>
            <div class="pd">
              <span>${product.category}</span>
              <strong>${product.price}</strong>
              <span>Estoque: ${product.stock}</span>
            </div>
          `

      divProdutos.appendChild(card)
    }

    formConfirm.onsubmit = (evt) => {
      evt.preventDefault()
      const nameProd = document.getElementById('nameProd').value
      const descProd = document.getElementById('descProd').value
      const categProd = document.getElementById('categProd').value
      const stockProd = Number(document.getElementById('stockProd').value)

      passandoDados(nameProd, descProd, categProd, stockProd)
      formConfirm.reset()
    }

    function passandoDados(name, desc, categ, stock) {
      const dados = {
        title: name,
        description: desc,
        category: categ,
        stock: stock
      }
      addProduct(dados)
    }

    const addProduct = async (dados) => {
      let url = 'https://dummyjson.com/products/add'
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      })
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Erro na requisição: ${response.status}`);
          }
          return response.json();
        })
        .then((data) => {
          createdProducts.push(data)
          renderProd(data)
          console.log('Sucesso:', data);
          console.log('Produtos:', createdProducts)
          return data
        })
        .catch((error) => {
          console.error('Erro:', error);
        });
    }

    const buscandoDados = async (campo = "", id = undefined, categorie = []) => {
      divProdutos.innerHTML = "Carregando..."

      let url;

      if (id !== undefined) {
        url = `https://dummyjson.com/products/${id}`;
      } else if (categorie.length > 0) {
        url = `https://dummyjson.com/products/category/${categorie[0]}`;
      } else if (campo.trim() !== "") {
        url = `https://dummyjson.com/products/search?q=${encodeURIComponent(campo)}`;
      } else {
        url = "https://dummyjson.com/products?limit=15";
      }

      try {
        const res = await fetch(url)
        if (!res.ok) { throw new Error('Dados Vazios') }

        const dados = await res.json()
        divProdutos.innerHTML = ""

        if (dados.products) {
          const allProducts = [...dados.products, ...createdProducts]
          if (allProducts.length === 0) {
            divProdutos.innerHTML = "Produto não encontrado."
            return
          }
          allProducts.forEach(prod => {
            renderProd(prod)
          });
        } else {
          renderProd(dados)
        }

      } catch (error) {
        console.error('Erro encontrado: ' + error)
        divProdutos.innerHTML = "Produto não encontrado."
        return
      }
    }

    let categFind = []

    const buscandoCateg = async () => {
      try {
        const res = await fetch('https://dummyjson.com/products/category-list')
        categFind = await res.json()
      } catch (error) {
        console.error('Erro ao buscar categoria: ', error)
      }
    }

    buscandoCateg()

    inputTeste.addEventListener('input', async (evt) => {
      const campo = evt.target.value.replace(/\s/g, '')
      let numAchados = []

      const categAchada = campo ? categFind.filter(categ => categ.toLowerCase().includes(campo)) : [];

      for (const camp of campo) {
        if (/\d/.test(camp)) {
          numAchados.push(camp)
        }
      }

      const numerosId = numAchados.join('')
      console.log(numerosId)

      clearTimeout(setCampo)

      setCampo = setTimeout(() => {
        if (/^\d+$/.test(campo)) {
          buscandoDados("", numerosId);
        } else {
          buscandoDados(campo, undefined, categAchada);
        }
      }, 500);
    })

    buscandoDados()
  </script>
</body>

</html>
